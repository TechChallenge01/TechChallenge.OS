name: Terraform Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

env:
  AWS_REGION: us-east-1
  TF_DIR: infra

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_mongodb_root_password: ${{ secrets.TF_VAR_MONGODB_ROOT_PASSWORD }}
          TF_VAR_rabbitmq_username: ${{ secrets.TF_VAR_RABBITMQ_USERNAME }}
          TF_VAR_rabbitmq_password: ${{ secrets.TF_VAR_RABBITMQ_PASSWORD }}
          TF_VAR_jwt_key: ${{ secrets.TF_VAR_JWT_KEY }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: >
          github.event_name == 'push' ||
          github.event.inputs.action == 'apply'
        env:
          TF_VAR_mongodb_root_password: ${{ secrets.TF_VAR_MONGODB_ROOT_PASSWORD }}
          TF_VAR_rabbitmq_username: ${{ secrets.TF_VAR_RABBITMQ_USERNAME }}
          TF_VAR_rabbitmq_password: ${{ secrets.TF_VAR_RABBITMQ_PASSWORD }}
          TF_VAR_jwt_key: ${{ secrets.TF_VAR_JWT_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        env:
          TF_VAR_mongodb_root_password: ${{ secrets.TF_VAR_MONGODB_ROOT_PASSWORD }}
          TF_VAR_rabbitmq_username: ${{ secrets.TF_VAR_RABBITMQ_USERNAME }}
          TF_VAR_rabbitmq_password: ${{ secrets.TF_VAR_RABBITMQ_PASSWORD }}
          TF_VAR_jwt_key: ${{ secrets.TF_VAR_JWT_KEY }}
        run: terraform destroy -auto-approve

      - name: Show Outputs
        if: success() && (github.event_name == 'push' || github.event.inputs.action == 'apply')
        run: terraform output
